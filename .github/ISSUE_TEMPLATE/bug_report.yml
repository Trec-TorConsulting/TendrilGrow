name: Bug report
description: Report a reproducible problem in TendrilGrow
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps
      placeholder: |
        1. Go to ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true

  - type: input
    id: tg_version
    attributes:
      label: TendrilGrow version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (sanitized)
      description: Do not include secrets or API keys
