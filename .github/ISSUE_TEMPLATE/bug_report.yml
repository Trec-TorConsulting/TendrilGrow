name: Bug report
description: Report a reproducible problem in TendrilGrow
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Never include API keys,
        tokens, or private URLs, and sanitize logs before pasting.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am running the latest TendrilGrow release.
          required: true
        - label: I reviewed the documentation and troubleshooting guide.
          required: false
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Config / options flow
        - AI health checks
        - Tuya water monitoring
        - Pumps (control / power)
        - Reservoir flush tracking
        - Sensors / VPD / entities
        - Dashboards
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact steps
      placeholder: |
        1. Go to ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual (copied into custom_components)
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.7.4
    validations:
      required: true

  - type: input
    id: tg_version
    attributes:
      label: TendrilGrow version
      placeholder: e.g. 0.1.4
    validations:
      required: true

  - type: dropdown
    id: ai_provider
    attributes:
      label: AI provider (if relevant)
      options:
        - Not applicable
        - None
        - Gemini
        - OpenAI
        - Ollama

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (sanitized)
      description: Logs from the custom_components.tendrilgrow logger. Never include secrets or API keys.
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Attach the redacted diagnostics download from the integration entry.
