name: lint-test

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: arc-runner-tendrilgrow-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        # The self-hosted ARC runner image has no C compiler; some Home
        # Assistant deps (e.g. lru-dict) build C extensions from source.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
