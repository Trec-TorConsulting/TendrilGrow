name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package integration for manual install
        run: |
          cd custom_components
          zip -r ../tendrilgrow.zip tendrilgrow -x '*/__pycache__/*' '*.pyc'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: tendrilgrow.zip
