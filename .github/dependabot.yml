version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Home Assistant is pinned to the minimum supported version (see hacs.json);
      # its floor is a compatibility decision, not an automated bump.
      - dependency-name: homeassistant
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns:
          - "*"
