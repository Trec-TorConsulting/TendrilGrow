rebuild_automap:
  name: Rebuild auto-map
  description: Reload TendrilGrow entries to rebuild Tuya auto-mapped sensor roles.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional specific TendrilGrow config entry ID to reload. Leave empty to reload all loaded TendrilGrow entries.
      selector:
        text:

run_ai_health_check:
  name: Run AI health check
  description: Run a camera-based AI health analysis for one or all loaded TendrilGrow entries.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional specific TendrilGrow config entry ID to run. Leave empty to run all loaded TendrilGrow entries.
      selector:
        text:
    reason:
      name: Reason
      description: Optional reason string recorded with the AI check result.
      selector:
        text:

set_pump:
  name: Set pump
  description: Control a mapped pump (on, off, or toggle).
  fields:
    entry_id:
      name: Config entry ID
      description: The TendrilGrow config entry ID containing the pump mapping.
      required: true
      selector:
        text:
    pump:
      name: Pump
      description: The pump role (rdwc_pump, chiller_pump, or air_pump).
      required: true
      selector:
        select:
          options:
            - rdwc_pump
            - chiller_pump
            - air_pump
    action:
      name: Action
      description: The action to perform (on, off, or toggle).
      required: true
      selector:
        select:
          options:
            - "on"
            - "off"
            - toggle

mark_flush:
  name: Mark reservoir flush
  description: Record that a full reservoir flush and refill was just completed for a grow space.
  fields:
    entry_id:
      name: Config entry ID
      description: The TendrilGrow config entry ID whose reservoir was flushed.
      required: true
      selector:
        text:


