  # ==========================================================================
  # CLONE AREA DIGITAL TWIN
  # ==========================================================================
  - path: zone-clone
    title: Clone
    icon: mdi:sprout
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: custom:tendrilgrow-twin-card
            name: Clone Station
            # Sensors
            vpd: sensor.basement_clone_vpd
            leaf_vpd: sensor.basement_clone_leaf_vpd
            dew_point: sensor.basement_clone_dew_point
            # Lifecycle & AI
            stage: select.clone_growth_stage
            stage_started: date.clone_stage_started
            week: sensor.clone_week_in_stage
            projection: sensor.clone_stage_projection
            ai_health_score: sensor.basement_clone_ai_health_score
            ai_health_summary: sensor.basement_clone_ai_health_summary
            run_ai_health_check: button.clone_run_ai_health_check
            # Alerts
            mold_risk: binary_sensor.basement_clone_mold_risk
            flush_due: binary_sensor.clone_flush_due
            metrics_out_of_range: binary_sensor.basement_clone_metrics_out_of_range
            ai_critical_alert: binary_sensor.clone_ai_health_critical_alert
            # Target Bands
            target_ph_low: number.basement_clone_target_ph_low
            target_ph_high: number.basement_clone_target_ph_high
            target_ec_low: number.basement_clone_target_ec_low
            target_ec_high: number.basement_clone_target_ec_high
            target_vpd_low: number.basement_clone_target_vpd_low
            target_vpd_high: number.basement_clone_target_vpd_high
        column_span: 2

      - type: grid
        cards:
          - type: heading
            heading: Projections & History
            heading_style: subtitle
          - type: markdown
            title: Projections
            content: >
              **Projected stage end:** {{ state_attr('sensor.clone_stage_projection','projected_stage_end') }}

              **Projected harvest:** {{ state_attr('sensor.clone_stage_projection','projected_harvest_date') }}

              **Projected ready:** {{ state_attr('sensor.clone_stage_projection','projected_ready_date') }}
          - type: history-graph
            title: Canopy Climate History (24h)
            hours_to_show: 24
            entities:
              - sensor.basement_clone_vpd
              - sensor.basement_clone_leaf_vpd

      - type: grid
        cards:
          - type: heading
            heading: Cultivation Plan
            heading_style: subtitle
          - type: entities
            title: Cultivation Plan
            state_color: true
            entities:
              - text.clone_strain_genetics
              - select.basement_clone_water_type
              - number.clone_sites_plants
              - number.clone_total_system_volume
              - number.clone_feed_interval
              - number.clone_lights_on
              - time.basement_clone_lights_on_time
              - time.basement_clone_lights_off_time
              - number.clone_runoff_target
              - text.clone_nutrient_line
              - text.clone_base_nutrients
              - text.clone_additives
              - number.basement_clone_electricity_price
          - type: markdown
            title: AI Health Report
            content: "{{ state_attr('sensor.basement_clone_ai_health_score','report') }}"

    badges:
      - type: entity
        entity: binary_sensor.clone_ai_health_critical_alert
        visibility:
          - condition: state
            entity: binary_sensor.clone_ai_health_critical_alert
            state: "on"
      - type: entity
        entity: binary_sensor.basement_clone_mold_risk
        visibility:
          - condition: state
            entity: binary_sensor.basement_clone_mold_risk
            state: "on"
      - type: entity
        entity: binary_sensor.clone_flush_due
        visibility:
          - condition: state
            entity: binary_sensor.clone_flush_due
            state: "on"
      - type: entity
