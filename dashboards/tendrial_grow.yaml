      entity: button.3x3_mothers_tent_run_ai_health_check
      name: Run AI health check
  - type: grid
    cards:
    - type: heading
      heading: Reservoir
      heading_style: subtitle
    - type: tile
      entity: sensor.3x3_water_monitor_ph
      name: pH
    - type: tile
      entity: sensor.3x3_water_monitor_electrical_conductivity
      name: EC
    - type: tile
      entity: sensor.3x3_mothers_tent_vpd
      name: VPD
    - type: tile
      entity: sensor.3x3_water_monitor_cf
      name: CF
    - type: tile
      entity: sensor.3x3_water_monitor_total_dissolved_solids
      name: TDS
    - type: tile
      entity: sensor.3x3_water_monitor_oxidation_reduction_potential
      name: ORP
    - type: tile
      entity: sensor.3x3_water_monitor_temperature
      name: Water temperature
    - type: tile
      entity: sensor.3x3_controller_inside_temperature
      name: Temperature
    - type: tile
      entity: sensor.3x3_controller_inside_humidity
      name: Humidity
    - type: tile
      entity: binary_sensor.3x3_mothers_tent_ph_out_of_range
      name: pH band
    - type: tile
      entity: binary_sensor.3x3_mothers_tent_ec_out_of_range
      name: EC band
    - type: tile
      entity: binary_sensor.3x3_mothers_tent_vpd_out_of_range
      name: VPD band
    - type: entities
      title: Target bands
      state_color: true
      entities:
      - number.3x3_mothers_tent_target_ph_low
      - number.3x3_mothers_tent_target_ph_high
      - number.3x3_mothers_tent_target_ec_low
      - number.3x3_mothers_tent_target_ec_high
      - number.3x3_mothers_tent_target_vpd_low
      - number.3x3_mothers_tent_target_vpd_high
  - type: grid
    cards:
    - type: heading
      heading: Operations
      heading_style: subtitle
    - type: tile
      entity: binary_sensor.3x3_mothers_tent_flush_due
      name: Flush due
    - type: tile
      entity: sensor.3x3_mothers_tent_days_until_flush
      name: Days until flush
    - type: tile
      entity: sensor.3x3_mothers_tent_days_since_flush
      name: Days since flush
    - type: tile
      entity: sensor.3x3_mothers_tent_next_flush_due
      name: Next flush due
    - type: tile
      entity: sensor.3x3_mothers_tent_last_flush
      name: Last flush
    - type: tile
      entity: button.3x3_mothers_tent_flush_now
      name: Flush now
    - type: tile
      entity: number.3x3_mothers_tent_flush_interval
      name: Flush interval
  - type: grid
    cards:
    - type: heading
      heading: Advisor
      heading_style: subtitle
    - type: markdown
      title: AI Health Report
      content: '{{ state_attr(''sensor.3x3_mothers_tent_ai_health_score'',''report'')
        }}'
    - type: markdown
      title: AI Feeding Schedule
      content: '{{ state_attr(''sensor.3x3_mothers_tent_ai_health_score'',''feeding_schedule_md'')
        }}'
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Plan
      heading_style: subtitle
    - type: entities
      title: Cultivation Plan
      state_color: true
      entities:
      - text.3x3_mothers_tent_strain_genetics
      - select.3x3_mothers_tent_water_type
      - number.3x3_mothers_tent_sites_plants
      - number.3x3_mothers_tent_reservoir_volume
      - number.3x3_mothers_tent_feed_interval
      - number.3x3_mothers_tent_lights_on
      - time.3x3_mothers_tent_lights_on_time
      - time.3x3_mothers_tent_lights_off_time
      - number.3x3_mothers_tent_runoff_target
      - text.3x3_mothers_tent_nutrient_line
      - text.3x3_mothers_tent_base_nutrients
      - text.3x3_mothers_tent_additives
      - number.3x3_mothers_tent_electricity_price
