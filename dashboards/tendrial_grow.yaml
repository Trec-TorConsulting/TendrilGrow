# Exported from the live Home Assistant dashboard 'Tendrial Grow' (url_path: tendrial-grow).
# Entity ids are specific to the source install; adjust the grow-space
# prefixes (e.g. tent_a_ / tent_b_) when reusing on another server.
title: Tendrial Grow
views:
- path: overview
  title: Executive
  icon: mdi:view-dashboard
  cards:
  - type: grid
    columns: 2
    square: false
    cards:
    - type: picture-entity
      entity: camera.grow_tent_3x3_fluent
      name: 3x3 Mothers Tent Snapshot
      camera_view: auto
      show_state: false
      tap_action:
        action: more-info
    - type: picture-entity
      entity: camera.grow_tent_4k_fluent
      name: 4x4 Full Cycle Tent Snapshot
      camera_view: auto
      show_state: false
      tap_action:
        action: more-info
  - type: markdown
    content: '## Operations Command Board


      Live reservoir chemistry, freshness, AI health, and lifecycle across all active
      grow spaces.'
  - type: grid
    columns: 2
    square: false
    cards:
    - type: entities
      title: 3x3 Mothers Tent Freshness
      state_color: true
      entities:
      - entity: button.3x3_mothers_tent_flush_now
        name: Flush now
        icon: mdi:water-sync
      - entity: binary_sensor.3x3_mothers_tent_flush_due
        name: Flush due?
      - entity: sensor.3x3_mothers_tent_days_since_flush
        name: Days since flush
      - entity: sensor.3x3_mothers_tent_days_until_flush
        name: Days until next
      show_header_toggle: false
    - type: entities
      title: 4x4 Full Cycle Tent Freshness
      state_color: true
      entities:
      - entity: button.4x4_full_cycle_tent_flush_now
        name: Flush now
        icon: mdi:water-sync
      - entity: binary_sensor.4x4_full_cycle_tent_flush_due
        name: Flush due?
      - entity: sensor.4x4_full_cycle_tent_days_since_flush
        name: Days since flush
      - entity: sensor.4x4_full_cycle_tent_days_until_flush
        name: Days until next
      show_header_toggle: false
    - type: entities
      title: Clone Freshness
      state_color: true
      entities:
      - entity: button.clone_flush_now
        name: Flush now
        icon: mdi:water-sync
      - entity: binary_sensor.clone_flush_due
        name: Flush due?
      - entity: sensor.clone_days_since_flush
        name: Days since flush
      - entity: sensor.clone_days_until_flush
        name: Days until next
      show_header_toggle: false
  - type: grid
    columns: 2
    square: false
    cards:
    - type: entities
      title: 3x3 Mothers Tent Snapshot
      state_color: true
      entities:
      - sensor.3x3_water_monitor_ph
      - sensor.3x3_water_monitor_electrical_conductivity
      - sensor.3x3_water_monitor_cf
      - sensor.3x3_water_monitor_total_dissolved_solids
      - sensor.3x3_water_monitor_oxidation_reduction_potential
      - sensor.3x3_water_monitor_temperature
      - sensor.3x3_controller_inside_humidity
    - type: entities
      title: 4x4 Full Cycle Tent Snapshot
      state_color: true
      entities:
      - sensor.4x4_water_monitor_ph
      - sensor.4x4_water_monitor_electrical_conductivity
      - sensor.4x4_water_monitor_cf
      - sensor.4x4_water_monitor_total_dissolved_solids
      - sensor.4x4_water_monitor_oxidation_reduction_potential
      - sensor.4x4_water_monitor_temperature
      - sensor.4x4_controller_inside_humidity
  - type: history-graph
    title: Water Temperature and pH Trend (24h)
    hours_to_show: 24
    entities:
    - sensor.3x3_water_monitor_temperature
    - sensor.3x3_water_monitor_ph
    - sensor.4x4_water_monitor_temperature
    - sensor.4x4_water_monitor_ph
  - type: grid
    columns: 2
    square: false
    cards:
    - type: gauge
      entity: sensor.3x3_mothers_tent_ai_health_score
      name: 3x3 Mothers Tent AI Health
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 50
        green: 75
    - type: gauge
      entity: sensor.4x4_full_cycle_tent_ai_health_score
      name: 4x4 Full Cycle Tent AI Health
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 50
        green: 75
    - type: gauge
      entity: sensor.basement_clone_ai_health_score
      name: Clone AI Health
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 50
        green: 75
- path: zone-3x3_mothers_tent
  title: 3x3 Mothers Tent
  icon: mdi:sprout
  cards:
  - type: picture-entity
    entity: camera.grow_tent_3x3_fluent
    name: 3x3 Mothers Tent Snapshot
    camera_view: auto
    show_state: false
    tap_action:
      action: more-info
  - type: entities
    title: 3x3 Mothers Tent Telemetry
    state_color: true
    entities:
    - sensor.3x3_water_monitor_ph
    - sensor.3x3_water_monitor_electrical_conductivity
    - sensor.3x3_water_monitor_cf
    - sensor.3x3_water_monitor_total_dissolved_solids
    - sensor.3x3_water_monitor_oxidation_reduction_potential
    - sensor.3x3_water_monitor_temperature
    - sensor.3x3_controller_inside_temperature
    - sensor.3x3_controller_inside_humidity
    - sensor.3x3_mothers_tent_vpd
  - type: entities
    title: Reservoir Flush
    state_color: true
    entities:
    - entity: button.3x3_mothers_tent_flush_now
      name: Flush now
      icon: mdi:water-sync
    - entity: number.3x3_mothers_tent_flush_interval
      name: Flush interval
    - type: divider
    - entity: binary_sensor.3x3_mothers_tent_flush_due
      name: Flush due?
    - entity: sensor.3x3_mothers_tent_days_since_flush
      name: Days since flush
    - entity: sensor.3x3_mothers_tent_days_until_flush
      name: Days until next
    - entity: sensor.3x3_mothers_tent_next_flush_due
      name: Next due
    - entity: sensor.3x3_mothers_tent_last_flush
      name: Last flush
    show_header_toggle: false
  - type: markdown
    title: Grow Timeline
    content: '**Stage:** {{ states(''select.3x3_mothers_tent_growth_stage'') }} (week
      {{ states(''number.3x3_mothers_tent_week_in_stage'') }})


      **Days left in stage:** {{ states(''sensor.3x3_mothers_tent_stage_projection'')
      }} d


      **Projected stage end:** {{ state_attr(''sensor.3x3_mothers_tent_stage_projection'',''projected_stage_end'')
      }}


      **Projected harvest:** {{ state_attr(''sensor.3x3_mothers_tent_stage_projection'',''projected_harvest_date'')
      }}


      **Projected ready:** {{ state_attr(''sensor.3x3_mothers_tent_stage_projection'',''projected_ready_date'')
      }}'
  - type: entities
    title: AI Health
    state_color: true
    entities:
    - sensor.3x3_mothers_tent_ai_health_score
    - sensor.3x3_mothers_tent_ai_health_summary
    - sensor.3x3_mothers_tent_ai_last_health_check
    - binary_sensor.3x3_mothers_tent_ai_health_critical_alert
    - button.3x3_mothers_tent_run_ai_health_check
  - type: markdown
    title: AI Health Report
    content: '{{ state_attr(''sensor.3x3_mothers_tent_ai_health_score'',''report'')
      }}'
  - type: markdown
    title: AI Feeding Schedule
    content: '{{ state_attr(''sensor.3x3_mothers_tent_ai_health_score'',''feeding_schedule_md'')
      }}'
  - type: entities
    title: Cultivation Plan
    entities:
    - text.3x3_mothers_tent_strain_genetics
    - select.3x3_mothers_tent_growth_stage
    - select.3x3_mothers_tent_water_type
    - number.3x3_mothers_tent_week_in_stage
    - number.3x3_mothers_tent_sites_plants
    - number.3x3_mothers_tent_reservoir_volume
    - number.3x3_mothers_tent_target_ph
    - number.3x3_mothers_tent_target_ec
    - number.3x3_mothers_tent_feed_interval
    - number.3x3_mothers_tent_lights_on
    - number.3x3_mothers_tent_runoff_target
    - text.3x3_mothers_tent_nutrient_line
    - text.3x3_mothers_tent_base_nutrients
    - text.3x3_mothers_tent_additives
