# Exported from the live Home Assistant dashboard 'Tendrial Grow' (url_path: tendrial-grow).
# Entity ids are specific to the source install; adjust the grow-space
# prefixes (e.g. tent_a_ / tent_b_) when reusing on another server.
title: Tendrial Grow
views:
- path: overview
  title: Executive
  icon: mdi:view-dashboard
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: 3x3 Mothers Tent
      heading_style: title
    - type: picture-entity
      entity: camera.grow_tent_3x3_fluent
      name: 3x3 Mothers Tent Snapshot
      camera_view: auto
      show_state: false
      tap_action:
        action: more-info
    - type: gauge
      entity: sensor.3x3_mothers_tent_ai_health_score
      name: 3x3 Mothers Tent AI Health
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 50
        green: 75
    - type: tile
      entity: sensor.3x3_mothers_tent_ai_health_summary
      name: Summary
    - type: tile
      entity: binary_sensor.3x3_mothers_tent_metrics_out_of_range
      name: Metrics out of range
    - type: tile
      entity: binary_sensor.3x3_mothers_tent_flush_due
      name: Flush due
    - type: tile
      entity: sensor.3x3_mothers_tent_days_until_flush
      name: Days until flush
  - type: grid
    cards:
    - type: heading
      heading: 4x4 Full Cycle Tent
      heading_style: title
    - type: picture-entity
      entity: camera.grow_tent_4k_fluent
      name: 4x4 Full Cycle Tent Snapshot
      camera_view: auto
      show_state: false
      tap_action:
        action: more-info
    - type: gauge
      entity: sensor.4x4_full_cycle_tent_ai_health_score
      name: 4x4 Full Cycle Tent AI Health
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 50
        green: 75
    - type: tile
      entity: sensor.4x4_full_cycle_tent_ai_health_summary
      name: Summary
    - type: tile
      entity: binary_sensor.4x4_full_cycle_tent_metrics_out_of_range
      name: Metrics out of range
    - type: tile
      entity: binary_sensor.4x4_full_cycle_tent_flush_due
      name: Flush due
    - type: tile
      entity: sensor.4x4_full_cycle_tent_days_until_flush
      name: Days until flush
  - type: grid
    cards:
    - type: heading
      heading: Clone
      heading_style: title
    - type: gauge
      entity: sensor.basement_clone_ai_health_score
      name: Clone AI Health
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 50
        green: 75
    - type: tile
      entity: sensor.basement_clone_ai_health_summary
      name: Summary
    - type: tile
      entity: binary_sensor.basement_clone_metrics_out_of_range
      name: Metrics out of range
    - type: tile
      entity: binary_sensor.clone_flush_due
      name: Flush due
    - type: tile
      entity: sensor.clone_days_until_flush
      name: Days until flush
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Trend
      heading_style: subtitle
    - type: history-graph
      title: Water Temperature and pH Trend (24h)
      hours_to_show: 24
      entities:
      - sensor.3x3_water_monitor_temperature
      - sensor.3x3_water_monitor_ph
      - sensor.4x4_water_monitor_temperature
      - sensor.4x4_water_monitor_ph
  badges:
  - type: entity
    entity: binary_sensor.3x3_mothers_tent_metrics_out_of_range
    visibility:
    - condition: state
      entity: binary_sensor.3x3_mothers_tent_metrics_out_of_range
      state: 'on'
  - type: entity
    entity: binary_sensor.3x3_mothers_tent_flush_due
    visibility:
    - condition: state
      entity: binary_sensor.3x3_mothers_tent_flush_due
      state: 'on'
  - type: entity
    entity: binary_sensor.4x4_full_cycle_tent_metrics_out_of_range
    visibility:
    - condition: state
      entity: binary_sensor.4x4_full_cycle_tent_metrics_out_of_range
      state: 'on'
  - type: entity
    entity: binary_sensor.4x4_full_cycle_tent_flush_due
    visibility:
    - condition: state
      entity: binary_sensor.4x4_full_cycle_tent_flush_due
      state: 'on'
  - type: entity
    entity: binary_sensor.basement_clone_metrics_out_of_range
    visibility:
    - condition: state
      entity: binary_sensor.basement_clone_metrics_out_of_range
      state: 'on'
  - type: entity
    entity: binary_sensor.clone_flush_due
    visibility:
    - condition: state
      entity: binary_sensor.clone_flush_due
      state: 'on'
- path: zone-3x3_mothers_tent
  title: 3x3 Mothers Tent
  icon: mdi:sprout
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Watch
      heading_style: subtitle
    - type: picture-entity
      entity: camera.grow_tent_3x3_fluent
      name: 3x3 Mothers Tent Snapshot
      camera_view: auto
      show_state: false
      tap_action:
        action: more-info
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: 3x3 Mothers Tent
      heading_style: title
    - type: tile
      entity: select.3x3_mothers_tent_growth_stage
      name: Stage
    - type: tile
      entity: date.3x3_mothers_tent_stage_started
      name: Stage started
    - type: tile
      entity: sensor.3x3_mothers_tent_week_in_stage
      name: Week in stage
    - type: tile
      entity: sensor.3x3_mothers_tent_stage_projection
      name: Days left in stage
    - type: markdown
      title: Projections
      content: '**Projected stage end:** {{ state_attr(''sensor.3x3_mothers_tent_stage_projection'',''projected_stage_end'')
        }}


        **Projected harvest:** {{ state_attr(''sensor.3x3_mothers_tent_stage_projection'',''projected_harvest_date'')
        }}


        **Projected ready:** {{ state_attr(''sensor.3x3_mothers_tent_stage_projection'',''projected_ready_date'')
        }}'
  - type: grid
    cards:
    - type: heading
      heading: AI
      heading_style: subtitle
    - type: gauge
      entity: sensor.3x3_mothers_tent_ai_health_score
      name: 3x3 Mothers Tent AI Health
      min: 0
      max: 100
      severity:
        red: 0
        yellow: 50
        green: 75
    - type: tile
      entity: sensor.3x3_mothers_tent_ai_health_summary
      name: Summary
    - type: tile
      entity: sensor.3x3_mothers_tent_ai_last_health_check
      name: Last check
